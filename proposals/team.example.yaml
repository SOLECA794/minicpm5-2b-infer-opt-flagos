team_statement: |
  三名成员均在项目周期内保持稳定投入，分工覆盖「框架层—算子层—评测层」三个层次，
  互不阻塞可并行推进。团队已建立统一的实验记录规范：每次改动同时产出
  4k 吞吐、16k 吞吐、TTFT 与 math_500 精度四项指标，并按 patch 粒度归档，
  确保技术报告中的每条策略都能对应到可复现的代码改动。

compute_request:
  tianshu_bv150_card_days: 17
  metax_c500_card_days: 8
  note: |
    天数占比更高，因为其优化空间更大、需要更多 profiling 与 autotune 迭代。
    我们承诺按「不浪费算力资源」原则使用：不做无假设的暴力搜索，
    每个实验都有明确的假设与证伪标准，未开发时段及时关机。