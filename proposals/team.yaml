  note: |
    天数占比更高，因为其优化空间更大（16k 场景 baseline 仅为沐曦的 13%），
    需要更多 profiling 与 autotune 迭代。两项合计 25 卡日，已含约 30% 冗余。

    我们承诺按「不浪费算力资源」原则使用：不做无假设的暴力搜索，
    每个实验都有明确的假设与证伪标准；未开发时段及时关机，
    沐曦侧按官方建议每 36 小时开关机一次以防数据丢失。