# ---------------------------------------------------------------------------
# 团队陈述：单人参赛的稳定性论证（对应评审「成员稳定性」10%）
# ---------------------------------------------------------------------------
team_statement: |
  本队以单人形式参赛。这一选择不是资源妥协，而是针对本赛题特点的主动取舍：

  第一，本赛题的核心难点在「诊断」而非「分工」。赛题把模型、框架、硬件、启动参数
  全部固定，唯一的自由度是框架与算子库的内部实现。这意味着工作流是高度串行的
  假设-验证循环：定位一处瓶颈、提出一个改动、跑一轮四项指标（4k/16k 吞吐、
  TTFT、精度）、再决定下一步。多人并行在这个循环里带来的协调成本，
  大于它能提供的并行收益。

  第二，单人参赛消除了本赛题最实际的风险——成员退出与进度不一致。赛程跨度
  从 9 月到 11 月，团队赛中任何一名成员的中断都会直接威胁交付完整性。
  单人模式下不存在这个风险，决策链最短，实验迭代最快。

  第三，已有基础可以验证稳定性。在申请算力的同时，本队已完成全部不依赖 GPU 的
  准备工作：赛事规则与评分的本地化镜像、vllm-plugin-FL 与 FlagGems 的逐文件
  源码测绘（每条结论附 file:line 证据）、天数 16k 场景 599 秒 TTFT 的根因假设
  与最小验证实验设计，以及可直接使用的评分计算器与精度/时延护栏校验脚本。
  这些工作说明拿到算力的第一天即可进入根因确认阶段，而非从零熟悉框架。

  风险与缓解：单人模式下两款芯片的实验必须串行，因此排期按「先做跨卡通用的
  框架层优化、再做芯片特化的内核调优」排序，保证任一时刻的产出都不依赖
  尚未拿到的第二块卡；同时在算力申请中预留了约 30% 的冗余卡日，
  用于吸收实验反复与机器状态波动。

