    duty: |
      独立承担从框架诊断到算子实现的全链路工作，按 P0→P1→P2→P3 串行推进，
      每个阶段都有独立的验收判据，前一阶段不达标不进入下一阶段：

      P0（主攻，占约 40% 精力）—— 修复天数侧的 attention 路径。
